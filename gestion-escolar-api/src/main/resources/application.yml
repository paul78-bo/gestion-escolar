server:
  port: 8083

spring:
  application:
    name: gestion-escolar-api
  
  datasource:
    # 👈 Usa la variable de entorno DB_URL. Si no existe, usa localhost (para cuando trabajes en tu PC).
    url: ${DB_URL:jdbc:mysql://localhost:3306/gestion_escolar_dbd?useSSL=false&serverTimezone=America/Mexico_City&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:felix123} # 👈 Por defecto felix123, pero en Docker usará la que definas
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # 👇 CORREGIDO: Alineado con datasource y jpa
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USER:schoolservicestech@gmail.com}
    password: ${SMTP_PASSWORD:tkchgatwtdrrwfsf}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jackson:
    time-zone: America/Mexico_City
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    com.gestionescolar.api: DEBUG
    org.hibernate.SQL: DEBUG  
    
# JWT
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: 4500000  # 24 horas en milisegundos

