<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva Contraseña - Gestión Escolar</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>🎓 Gestión Escolar</h1>
            <p style="color: #666; margin-bottom: 30px;">Crea tu nueva contraseña</p>
            
            <div id="mensaje" class="alert" style="display: none;"></div>
            
            <form id="resetForm" style="display: none;">
                <div class="form-group">
                    <label>Nueva Contraseña</label>
                    <input type="password" id="newPassword" class="form-control" required>
                    <small style="color: #666; font-size: 12px;">Mín. 8 caracteres, 1 mayúscula, 1 número y 2 símbolos.</small>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Cambiar contraseña</button>
            </form>
            
            <div id="loading" style="text-align: center;">Validando enlace...</div>
        </div>
    </div>

    <script>
        const API_URL = ''; // 👈 Cambia a tu IP de IONOS si estás en producción
        const urlParams = new URLSearchParams(window.location.search);
        const shortId = urlParams.get('shortId');
        const div = document.getElementById('mensaje');

        // Validar el token al cargar la página
        document.addEventListener('DOMContentLoaded', async () => {
            if (!shortId) {
                mostrarError('No se encontró un token válido en la URL.');
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/api/auth/validate-shortId?shortId=${shortId}`);
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('resetForm').style.display = 'block';
                } else {
                    mostrarError(data.message);
                }
            } catch (error) {
                mostrarError('Error al conectar con el servidor.');
            }
        });

        // Enviar la nueva contraseña
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            
            try {
                const response = await fetch(`${API_URL}/api/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ shortId, newPassword })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    div.className = 'alert alert-success';
                    div.textContent = '✅ ' + data.message + ' Redirigiendo al login...';
                    div.style.display = 'block';
                    setTimeout(() => window.location.href = 'login.html', 3000);
                } else {
                    mostrarError(data.message);
                }
            } catch (error) {
                mostrarError('Error al conectar con el servidor.');
            }
        });

        function mostrarError(mensaje) {
            document.getElementById('loading').style.display = 'none';
            div.className = 'alert alert-danger';
            div.textContent = '❌ ' + mensaje;
            div.style.display = 'block';
        }
    </script>
</body>
</html>
