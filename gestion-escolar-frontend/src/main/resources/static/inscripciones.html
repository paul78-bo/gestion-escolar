<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Inscripciones - Gestión Escolar</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
	<!-- SIDEBAR -->
	<div class="sidebar">
		<h2>🎓 Gestión Escolar</h2>
		<a href="dashboard.html">📊 Dashboard</a> <a href="alumnos.html">👥
			Alumnos</a> <a href="profesores.html">👨‍🏫 Profesores</a> <a
			href="materias.html">📚 Materias</a> <a href="grupos.html">🏫
			Grupos</a> <a href="ciclos.html">📅 Ciclos</a> <a
			href="asignaciones.html">📋 Asignaciones</a> <a
			href="inscripciones.html" class="active">📝 Inscripciones</a> <a
			href="calificaciones.html">📊 Calificaciones</a> <a href="#"
			onclick="logout()">🚪 Cerrar Sesión</a>
	</div>

	<!-- CONTENIDO -->
	<div class="content">
		<div class="banner">
			<h2>📝 Gestión de Inscripciones</h2>
			<div>
				Bienvenido, <strong id="usernameDisplay"></strong> | <span
					id="rolDisplay"></span>
			</div>
		</div>

		<div id="mensaje" class="alert" style="display: none;"></div>

		<div style="margin-bottom: 15px; text-align: right;">
			<button class="btn btn-success" onclick="abrirModal()">➕
				Nueva Inscripción</button>
		</div>

		<div class="card">
			<div style="display: flex; gap: 10px;">
				<input type="text" id="busqueda" class="form-control"
					placeholder="Buscar por alumno, matrícula o grupo...">
				<button class="btn btn-primary" onclick="buscar()">🔍
					Buscar</button>
				<button class="btn btn-secondary" onclick="limpiarBusqueda()">❌
					Limpiar</button>
			</div>
		</div>

		<div class="card">
			<table>
				<thead>
					<tr>
						<th>ID</th>
						<th>Alumno</th>
						<th>Matrícula</th>
						<th>Grupo</th>
						<th>Grado</th>
						<th>Turno</th>
						<th>Ciclo</th>
						<th>Estatus</th>
						<th>Acciones</th>
					</tr>
				</thead>
				<tbody id="tablaBody">
					<tr>
						<td colspan="9" style="text-align: center;">Cargando...</td>
					</tr>
				</tbody>
			</table>

			<div style="margin-top: 15px; text-align: center;">
				<button class="btn btn-secondary" id="btnAnterior"
					onclick="paginaAnterior()">← Anterior</button>
				<span style="margin: 0 15px;">Página <strong
					id="paginaActual">0</strong> de <strong id="totalPaginas">0</strong></span>
				<button class="btn btn-secondary" id="btnSiguiente"
					onclick="paginaSiguiente()">Siguiente →</button>
			</div>
		</div>
	</div>

	<!-- MODAL -->
	<div id="modal"
		style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 1000; justify-content: center; align-items: center;">
		<div class="card"
			style="width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto;">
			<h2 id="modalTitulo">Nueva Inscripción</h2>
			<form id="inscripcionForm">
				<input type="hidden" id="inscripcionId">

				<div class="form-group">
					<label>Alumno *</label> <select id="alumnoId" class="form-control"
						required>
						<option value="">-- Cargando alumnos... --</option>
					</select>
				</div>

				<div class="form-group">
					<label>Grupo *</label> <select id="grupoId" class="form-control"
						required>
						<option value="">-- Cargando grupos... --</option>
					</select>
				</div>

				<div class="form-group">
					<label>Fecha de Inscripción</label> <input type="date"
						id="fechaInscripcion" class="form-control">
				</div>

				<div class="form-group">
					<label>Estatus</label> <select id="estatus" class="form-control">
						<option value="ACTIVA">Activa</option>
						<option value="APROBADA">Aprobada</option>
						<option value="REPROBADA">Reprobada</option>
						<option value="BAJA">Baja</option>
						<option value="EGRESADO">Egresado</option>
					</select>
				</div>

				<div style="margin-top: 20px; text-align: right;">
					<button type="button" class="btn btn-secondary"
						onclick="cerrarModal()">Cancelar</button>
					<button type="submit" class="btn btn-primary">Guardar</button>
				</div>
			</form>
		</div>
	</div>

	<script src="js/config.js"></script>
	<script src="js/auth.js"></script>
	<script src="js/inscripciones.js"></script>
	<script>
    document.addEventListener('DOMContentLoaded', () => {
        ajustarMenuPorRol();
    });
</script>
</body>
</html>
