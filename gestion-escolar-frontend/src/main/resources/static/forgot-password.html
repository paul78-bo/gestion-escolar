<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña - Gestión Escolar</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>🎓 Gestión Escolar</h1>
            <p style="color: #666; margin-bottom: 30px;">Recuperar contraseña</p>
            
            <div id="mensaje" class="alert" style="display: none;"></div>
            
            <form id="forgotForm">
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="email" class="form-control" placeholder="tu@correo.com" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Enviar enlace</button>
            </form>
            
            <div style="text-align: center; margin-top: 15px;">
                <a href="login.html" style="color: #3b82f6; text-decoration: none; font-size: 14px;">Volver al login</a>
            </div>
        </div>
    </div>

    <script>
        const API_URL = ''; // 👈 Cambia a tu IP de IONOS si estás en  const API_URL = 'http://localhost:8083';
        
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const div = document.getElementById('mensaje');
            
            try {
                div.style.display = 'none';
                const response = await fetch(`${API_URL}/api/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                
                const data = await response.json();
                div.className = `alert alert-${data.success ? 'success' : 'danger'}`;
                div.textContent = data.message;
                div.style.display = 'block';
                
                if (data.success) document.getElementById('forgotForm').reset();
                
            } catch (error) {
                div.className = 'alert alert-danger';
                div.textContent = '❌ Error de conexión con el servidor';
                div.style.display = 'block';
            }
        });
    </script>
</body>
</html>
