<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Gestión Escolar</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>🎓 Gestión Escolar</h1>
            <p style="color: #666; margin-bottom: 30px;">Inicia sesión</p>
            
            <div id="error" class="alert alert-danger" style="display: none;"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>Usuario</label>
                    <input type="text" id="username" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Iniciar Sesión</button>
            </form>
             <div style="text-align: center; margin-top: 15px;">
                <a href="forgot-password.html" style="color: #3b82f6; text-decoration: none; font-size: 14px;">
                    ¿Olvidaste tu contraseña?
                </a>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '';//en linea
        //const API_URL = 'http://localhost:8083';  // local
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            
            try {
                errorDiv.style.display = 'none';
                
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || 'Credenciales incorrectas');
                }
                
                const data = await response.json();
                localStorage.setItem('token', data.token);
                localStorage.setItem('username', data.username);
                localStorage.setItem('rol', data.rol);
             // 👈 AGREGA ESTA LÍNEA AQUÍ
                localStorage.setItem('alumnoId', data.alumnoId); 
                
                window.location.href = 'dashboard.html';
                
            } catch (error) {
                errorDiv.textContent = '❌ ' + error.message;
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
